<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeBox</title>

<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#020617">
</head>

<body>

<header class="topbar">
    <a href="https://discord.gg/KTXm7ERkFe" 
       target="_blank" 
       class="logo-link">
        <img src="assets/logo.png" class="logo">
    </a>

    <h1>AnimeBox</h1>

    <button class="icon-btn" onclick="openSettings()">⚙️</button>
</header>
<div id="intro" class="intro">
    <h1 class="intro-logo">AnimeBox</h1>
</div>
<main id="content"></main>

<nav class="bottom-nav">
    <button id="homeTab">🏠</button>
    <button id="addTab" class="add-btn">➕</button>
    <button id="libraryTab">📚</button>
</nav>

<!-- ADD MODAL -->
<div id="addModal" class="modal hidden">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">❌</button>
        <h2 id="modalTitle">Ajouter</h2>

        <select id="type" onchange="toggleSeasonField()">
            <option value="anime">Anime</option>
            <option value="manga">Manga</option>
        </select>

        <div id="seasonContainer">
            <input type="text" id="season" placeholder="Saison (ex: S1, Film)">
        </div>

        <input type="text" id="name" placeholder="Titre" onblur="autoFill()">
        
        <!-- 🔗 NOUVEAU CHAMP LIEN -->
        <input type="url" id="link" placeholder="Lien pour lire/regarder (optionnel)">

        <input type="number" id="total" placeholder="Total épisodes/chapitres">
        <div class="number-control">
            <button type="button" onclick="changeCurrent(-1)">➖</button>
    
            <input type="number" id="current" placeholder="Progression" min="0">
    
            <button type="button" onclick="changeCurrent(1)">➕</button>
        </div>
        <input type="file" id="cover" accept="image/*">

        <select id="status">
            <option>En cours</option>
            <option>Terminé</option>
            <option>Abandonné</option>
            <option>En attente</option>
        </select>

        <button class="primary" onclick="saveAnime()">Ajouter</button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal hidden">
    <div class="modal-content">
        <button class="close-btn" onclick="closeSettings()">❌</button>
        <h2>Paramètres</h2>

        <!-- VERSION -->
        <p class="settings-version">
            Version : <span id="settingsVersion"></span>
        </p>

        <button class="primary" onclick="exportJSON()">Exporter JSON</button>
        <input type="file" accept=".json" onchange="importJSON(event)">

        <button class="danger" onclick="resetData()">Réinitialiser les données</button>
    </div>
</div>

<!-- TOAST NOTIFICATION (PLACÉ CORRECTEMENT DANS BODY) -->
<div id="toast" class="toast hidden">
    <span id="toastMessage"></span>
    <button onclick="closeToast()">❌</button>
</div>

<script src="app.js"></script>

</body>
</html>
