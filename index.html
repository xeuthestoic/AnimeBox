<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeBox</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/logo.png">
</head>

<body>

<header class="topbar">
    <img src="assets/logo.png" class="logo">
    <h1>AnimeBox</h1>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
</header>

<main id="content" class="page fade"></main>

<nav class="bottom-nav">
    <button id="homeTab">🏠</button>
    <button id="addTab" class="add-btn">＋</button>
    <button id="libraryTab">📚</button>
</nav>

<!-- ADD MODAL -->
<div id="addModal" class="modal hidden">
    <div class="modal-content slide-up">
        <div class="modal-header">
            <h2>Ajouter</h2>
            <button onclick="closeModal()">✕</button>
        </div>

        <input type="text" id="name" placeholder="Titre">
        <input type="number" id="total" placeholder="Total épisodes">
        <input type="number" id="current" placeholder="Progression">
        <input type="file" id="cover" accept="image/*">

        <select id="status">
            <option>En cours</option>
            <option>Terminé</option>
            <option>Abandonné</option>
            <option>En attente</option>
        </select>

        <div class="stars" id="stars"></div>

        <button class="primary" onclick="saveAnime()">Ajouter</button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal hidden">
    <div class="modal-content slide-up">
        <div class="modal-header">
            <h2>Paramètres</h2>
            <button onclick="closeSettings()">✕</button>
        </div>

        <button class="primary" onclick="exportJSON()">Exporter JSON</button>
        <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
