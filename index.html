<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimeBox</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<nav id="bottomBar">
  <button class="tab active" data-page="home">🏠</button>
  <button class="tab add" id="addBtnBottom">＋</button>
  <button class="tab" data-page="library">📚</button>
</nav>

<body>

<header>
  <h1>AnimeBox</h1>
  <input id="search" placeholder="Rechercher un anime...">
</header>

<main id="pages">

  <section id="homePage" class="page active">
  <section class="section">
    <h2>🆕 Récemment ajoutés</h2>
    <div class="row" id="recentRow"></div>
  </section>
    <div id="library"></div>
  </section>

  <section id="libraryPage" class="page">
    <h2 style="padding:14px;">📚 Bibliothèque</h2>
    <div id="allLibrary" class="grid"></div>
  </section>

</main>

<div id="modal" hidden>
  <form id="animeForm">
    <h2>Ajouter un anime</h2>
    <input id="title" required placeholder="Titre">
    <input id="episodes" type="number" placeholder="Épisodes totaux">
    <input id="image" type="file" accept="image/*">
    <select id="status">
      <option value="watching">En cours</option>
      <option value="planned">À voir</option>
      <option value="completed">Terminé</option>
      <option value="dropped">Abandonné</option>
    </select>
    <button>Ajouter</button>
  </form>
</div>

<script src="js/db.js"></script>
<script src="js/image.js"></script>
<script src="js/app.js"></script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
