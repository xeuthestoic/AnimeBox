<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeBox</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/logo.png">
</head>

<body>

<header>
    <img src="assets/logo.png" class="logo">
    <h1>AnimeBox</h1>
</header>

<main id="content"></main>

<nav class="bottom-nav">
    <button id="homeTab">🏠</button>
    <button id="addTab" class="add-btn">＋</button>
    <button id="libraryTab">📚</button>
</nav>

<!-- Modal Add -->
<div id="addModal" class="modal hidden">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✖</button>

        <h2>Ajouter</h2>

        <select id="type">
            <option value="anime">Anime</option>
            <option value="manga">Manga</option>
        </select>

        <input type="text" id="name" placeholder="Nom">

        <input type="file" id="cover" accept="image/*">

        <input type="number" id="total" placeholder="Total épisodes/chapitres">

        <input type="number" id="current" placeholder="Avancée actuelle">

        <select id="status">
            <option>En cours</option>
            <option>Abandonné</option>
            <option>Terminé</option>
            <option>En attente</option>
            <option>À lire / À regarder</option>
        </select>

        <div class="stars" id="stars"></div>

        <button onclick="saveAnime()">Sauvegarder</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
